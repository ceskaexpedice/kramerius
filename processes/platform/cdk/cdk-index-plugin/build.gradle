plugins {
    id 'java-library'
    id 'org.ceskaexpedice.processplatform.process' version '1.0.6'
}

description "CDK index"

processPlugin {
	spiImplementation='org.kramerius.plugin.CDKIndexSPI'
    profiles = [
            [profileId: "cdk-index", description: "CDK index", jvmArgs: ["-Xms1g","-Xmx32g"]]
    ]
	
	excludeDependencies = [
        'com.sun.jersey',
        'javax.ws.rs'
    ]
}

dependencies{
    api project(':processes:search-index')
    api project(':processes:cdk:cdkprocesses')
    api "org.ceskaexpedice:process-api:${processapiversion}"
}


