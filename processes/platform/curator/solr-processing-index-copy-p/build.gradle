plugins {
    id 'java-library'
    id 'org.ceskaexpedice.processplatform.process' version '1.0.6'
}

description "Copy the processing Solr index"

processPlugin {
    spiImplementation = 'org.kramerius.plugin.SolrProcessingIndexCopySPI'
    profiles = [
            [profileId: "solr-processing-index-copy", description: "Copy the processing index", jvmArgs: ["-Xms512m", "-Xmx4g"]]
    ]
    excludeDependencies = ['com.sun.jersey', 'javax.ws.rs']
}

dependencies {
    implementation "org.ceskaexpedice:process-api:${processapiversion}"
    implementation project(':processes:solr-migration')
}
