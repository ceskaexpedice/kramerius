plugins {
    id 'java-library'
    id 'org.ceskaexpedice.processplatform.process' version '1.0.6'
}

description "Rebuild search index from processing index into a selected collection"

processPlugin {
    spiImplementation = 'org.kramerius.plugin.SearchIndexProcessingSPI'
    profiles = [
            [profileId: "search-index-processing", description: "Build search index from processing index", jvmArgs: ["-Xms1g", "-Xmx32g"]]
    ]
    excludeDependencies = ['com.sun.jersey', 'javax.ws.rs']
}

dependencies {
    implementation project(':processes:search-index')
    implementation "org.ceskaexpedice:process-api:${processapiversion}"
}
